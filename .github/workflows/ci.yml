name: CI
# PAUSED (GitHub Actions billing): runs only when started by hand from the Actions tab.
# To re-enable automatic runs, replace `workflow_dispatch:` with:
#   push:
#     branches: [main]
#   pull_request:
on:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
