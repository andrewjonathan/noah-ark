# Push a tag like v0.1.0 -> builds and publishes to PyPI.
# One-time setup: on pypi.org add a "Trusted Publisher" for this repo
# (workflow: release.yml, environment: pypi). No API token needed.
name: Release
# PAUSED (GitHub Actions billing): pushing a tag no longer publishes.
# It can still be started by hand from the Actions tab (pick the tag as the ref).
# To re-enable publish-on-tag, replace `workflow_dispatch:` with:
#   push:
#     tags: ["v*"]
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
