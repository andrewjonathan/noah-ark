[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "noah-ark"
dynamic = ["version"]
description = "Run all your services from one YAML file with one command: labelled live logs, restarts, dependency order."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Andrew Jonathan" }]
keywords = ["process-manager", "pm2", "supervisor", "fastapi", "devtools", "microservices"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Systems Administration",
  "Topic :: Software Development :: Build Tools",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "build>=1.2"]

[project.scripts]
noah = "noah_ark.cli:main"
noah-ark = "noah_ark.cli:main"

[project.urls]
Homepage = "https://github.com/andrewjonathan/noah-ark"
Issues = "https://github.com/andrewjonathan/noah-ark/issues"
Changelog = "https://github.com/andrewjonathan/noah-ark/releases"

[tool.hatch.version]
path = "src/noah_ark/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/noah_ark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]  # always test the working tree, never an installed copy

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["UP041"]
